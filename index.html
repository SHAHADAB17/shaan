<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070b14">
<title>ShaanChat Pro</title>
<style>
:root{
  --bg:#070b14;--panel:#0b111d;--panel2:#101827;--line:rgba(255,255,255,.09);
  --text:#f6f8ff;--muted:#8490a5;--cyan:#00eaff;--purple:#7c3cff;--green:#48e6a1;
  --danger:#ff667d;--bubble:#151d2c;--mine:linear-gradient(135deg,#006f83,#7137c9);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 20% 20%,rgba(0,255,255,.12),transparent 30%),radial-gradient(circle at 80% 80%,rgba(120,0,255,.15),transparent 30%),var(--bg);color:var(--text)}
button,input{font:inherit}.hidden{display:none!important}.btn{border:0;cursor:pointer}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{width:100%;max-width:430px;padding:35px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.logo{text-align:center;font-size:32px;font-weight:900;margin-bottom:8px}.logo span,.brand span{color:var(--cyan)}
.subtitle{text-align:center;color:#9da8bb;margin-bottom:28px}
.input,.search,.message-input{width:100%;padding:14px 16px;margin-bottom:14px;border-radius:12px;border:1px solid var(--line);outline:none;background:rgba(0,0,0,.25);color:#fff}
.input:focus,.search:focus,.message-input:focus{border-color:var(--cyan)}
.auth-main-btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font-weight:800}
.switch{text-align:center;margin-top:18px;color:#9da8bb}.switch span{color:var(--cyan);cursor:pointer}.error{color:#ff6b81;text-align:center;margin-top:15px;font-size:13px;min-height:18px}
.app{display:none;height:100vh;min-height:600px}.app.show{display:flex}
.sidebar{width:340px;border-right:1px solid var(--line);background:rgba(7,11,20,.94);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-top{padding:18px;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:900}
.me{display:flex;align-items:center;gap:12px;margin-top:18px}.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--cyan),var(--purple));font-weight:900;overflow:hidden;flex-shrink:0}.avatar img,.user-avatar img,.chat-avatar img{width:100%;height:100%;object-fit:cover}
.me-info{min-width:0}.me-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me-info small{color:var(--green)}.logout{margin-left:auto;background:transparent;color:var(--danger);cursor:pointer;border:0}
.profile-actions{display:flex;gap:8px;margin-top:12px}.small-btn{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#111927;color:#bfc8d9;cursor:pointer;font-size:12px}
.search{margin-top:16px;margin-bottom:0}.users{overflow:auto;flex:1}.section-label{padding:12px 18px;color:#68758c;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.user{padding:14px 18px;display:flex;align-items:center;gap:11px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}.user:hover,.user.active{background:rgba(0,234,255,.08)}
.user-avatar,.chat-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#172033;color:var(--cyan);font-weight:800;overflow:hidden;flex-shrink:0;position:relative}
.user-info{min-width:0;flex:1}.user-name{font-weight:700}.user-email{color:#8490a5;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.presence-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5d687b;margin-right:5px}.presence-dot.online{background:#2ce68d;box-shadow:0 0 8px #2ce68d}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}.chat-header{min-height:75px;padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.76)}
.chat-head-info{min-width:0}.chat-title{font-weight:800}.chat-status{font-size:12px;color:var(--green);margin-top:3px}.chat-tools{margin-left:auto;display:flex;gap:7px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#111927;color:#d7deeb;cursor:pointer}
.mobile-back{display:none;border:0;background:transparent;color:var(--cyan);font-size:21px}
.messages{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.empty{margin:auto;text-align:center;color:#778298}
.message-wrap{max-width:78%;display:flex;flex-direction:column;position:relative}.message-wrap.sent{align-self:flex-end;align-items:flex-end}.message-wrap.received{align-self:flex-start;align-items:flex-start}
.message{padding:10px 13px;border-radius:16px;line-height:1.4;word-break:break-word;background:var(--bubble);position:relative}.sent .message{background:var(--mine);border-bottom-right-radius:4px}.received .message{border-bottom-left-radius:4px}
.message img.media{max-width:280px;max-height:300px;border-radius:12px;display:block}.file-card{display:flex;align-items:center;gap:9px;min-width:200px}.file-card a{color:#fff;text-decoration:none;font-weight:700}.message-time{display:block;font-size:10px;opacity:.65;margin-top:5px;text-align:right}.ticks{font-size:11px;margin-left:4px}.ticks.seen{color:#69efff}
.reply-preview{border-left:3px solid var(--cyan);padding:6px 8px;margin-bottom:7px;background:rgba(0,0,0,.16);border-radius:7px;font-size:11px;opacity:.85}
.message-actions{display:none;gap:4px;position:absolute;top:-35px;background:#111927;border:1px solid var(--line);padding:4px;border-radius:9px;z-index:3}.message-wrap:hover .message-actions{display:flex}.message-actions button{border:0;background:transparent;color:#cbd4e3;cursor:pointer;padding:4px}
.typing{height:22px;padding:0 20px;color:#65dff0;font-size:12px;font-style:italic}
.composer{padding:10px 14px;display:flex;gap:8px;border-top:1px solid var(--line);background:rgba(7,11,20,.88);align-items:center}.message-input{margin:0;flex:1}.send{width:50px;height:48px;border:0;border-radius:13px;background:var(--cyan);color:#001218;font-size:20px;cursor:pointer}.send:disabled{opacity:.35}.attach{width:42px;height:42px;border:0;background:transparent;color:#aab6c9;font-size:22px;cursor:pointer}.recording{color:#ff667d!important}.reply-bar{position:absolute;left:0;right:0;bottom:70px;padding:9px 14px;background:#111927;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.reply-bar .close{margin-left:auto;background:transparent;border:0;color:#ff667d;cursor:pointer}
.app{position:relative}.toast{position:fixed;right:18px;bottom:18px;background:#111927;border:1px solid var(--line);padding:11px 14px;border-radius:10px;z-index:100;color:#fff;box-shadow:0 12px 35px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}.modal-card{width:100%;max-width:480px;background:#0d1421;border:1px solid var(--line);border-radius:18px;padding:22px}.modal-title{font-size:20px;font-weight:800;margin-bottom:15px}.modal-row{display:flex;gap:10px}.modal-row>*{flex:1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.check-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}.check-item{padding:11px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.check-item:last-child{border-bottom:0}
.theme-light{--bg:#edf2f8;--panel:#fff;--panel2:#f3f6fb;--line:rgba(15,25,45,.12);--text:#142033;--muted:#607089;--bubble:#e6ebf3}.theme-light body{background:#edf2f8}.theme-light .sidebar,.theme-light .chat-header,.theme-light .composer{background:rgba(255,255,255,.9)}.theme-light .input,.theme-light .search,.theme-light .message-input,.theme-light .small-btn,.theme-light .icon-btn{background:#fff;color:#142033}.theme-light .message.received{background:#e3e9f2}.theme-light .file-card a{color:#142033}
@media(max-width:800px){.sidebar{width:100%}.chat{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .chat{display:flex}.mobile-back{display:block}.message-wrap{max-width:88%}.chat-tools{display:none}}
</style>
</head>
<body>

<section class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="logo">shaan<span>Chat</span></div>
    <div class="subtitle">Private real-time messaging</div>
    <div id="registerFields" class="hidden"><input class="input" id="registerName" placeholder="Your name" maxlength="40"></div>
    <input class="input" id="email" type="email" placeholder="Email address">
    <input class="input" id="password" type="password" placeholder="Password">
    <button class="btn auth-main-btn" id="authBtn">Login</button>
    <div class="switch"><span id="switchText">Create a new account</span></div>
    <p class="error" id="authError"></p>
  </div>
</section>

<section class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">Pulse<span>Chat</span></div>
      <div class="me">
        <div class="avatar" id="myAvatar">U</div>
        <div class="me-info"><strong id="myName">User</strong><small id="myPresence">● Online</small></div>
        <button class="logout" id="logoutBtn">Logout</button>
      </div>
      <div class="profile-actions">
        <button class="small-btn" id="profileBtn">👤 Profile</button>
        <button class="small-btn" id="groupBtn">👥 New group</button>
        <button class="small-btn" id="themeBtn">🌙 Theme</button>
        <button class="small-btn" id="notifyBtn">🔔 Notify</button>
      </div>
      <input class="search" id="searchUsers" placeholder="Search users...">
    </div>
    <div class="users" id="usersList"></div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <button class="mobile-back" id="backBtn">←</button>
      <div class="chat-avatar" id="chatAvatar">?</div>
      <div class="chat-head-info">
        <div class="chat-title" id="chatName">Select a user</div>
        <div class="chat-status" id="chatStatus">Start a conversation</div>
      </div>
      <div class="chat-tools">
        <button class="icon-btn" id="searchMessagesBtn" title="Search messages">🔎</button>
      </div>
    </header>
    <div class="messages" id="messages"><div class="empty">Select a user to start chatting 💬</div></div>
    <div class="typing" id="typingIndicator"></div>
    <div class="reply-bar hidden" id="replyBar"><div id="replyText"></div><button class="close" id="cancelReply">✕</button></div>
    <div class="composer">
      <input type="file" id="fileInput" hidden multiple>
      <button class="attach" id="attachBtn" title="Image/file">📎</button>
      <button class="attach" id="recordBtn" title="Voice message">🎤</button>
      <input class="message-input" id="messageInput" placeholder="Type a message..." disabled>
      <button class="send" id="sendBtn" disabled>➤</button>
    </div>
  </main>
</section>

<div class="modal hidden" id="profileModal">
  <div class="modal-card">
    <div class="modal-title">Profile</div>
    <input class="input" id="profileName" placeholder="Name">
    <input type="file" class="input" id="profilePhoto" accept="image/*">
    <div class="modal-actions"><button class="small-btn" data-close="profileModal">Cancel</button><button class="small-btn" id="saveProfile">Save</button></div>
  </div>
</div>

<div class="modal hidden" id="groupModal">
  <div class="modal-card">
    <div class="modal-title">Create group</div>
    <input class="input" id="groupName" placeholder="Group name" maxlength="50">
    <div class="check-list" id="groupUsers"></div>
    <div class="modal-actions"><button class="small-btn" data-close="groupModal">Cancel</button><button class="small-btn" id="createGroup">Create</button></div>
  </div>
</div>

<div class="modal hidden" id="searchModal">
  <div class="modal-card">
    <div class="modal-title">Search messages</div>
    <input class="input" id="messageSearchInput" placeholder="Search loaded messages...">
    <div id="messageSearchResults" style="max-height:320px;overflow:auto;color:#aeb9cb"></div>
    <div class="modal-actions"><button class="small-btn" data-close="searchModal">Close</button></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, setDoc, updateDoc, deleteDoc, doc, getDoc, getDocs,
  query, orderBy, onSnapshot, serverTimestamp, arrayUnion, arrayRemove, where,
  deleteField
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";
import {
  getMessaging, getToken, onMessage, isSupported
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging.js";
import {
  initializeAppCheck, ReCaptchaV3Provider
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app-check.js";

/* Firebase config from the working Shaan project */
const firebaseConfig={
  apiKey:"AIzaSyAsJnrF8MeSSvMuNHvBG31OFfKWdXf9mU",
  authDomain:"shaan1731.firebaseapp.com",
  projectId:"shaan1731",
  storageBucket:"shaan1731.firebasestorage.app",
  messagingSenderId:"605552600836",
  appId:"1:605552600836:web:b9ac71747648a6c2f6d251"
};

/* OPTIONAL: paste your public reCAPTCHA v3 site key here after App Check is registered. */
const APP_CHECK_SITE_KEY="";
/* OPTIONAL: paste your Firebase Cloud Messaging Web Push VAPID public key here. */
const VAPID_KEY="";

const firebaseApp=initializeApp(firebaseConfig);
if(APP_CHECK_SITE_KEY){
  try{initializeAppCheck(firebaseApp,{provider:new ReCaptchaV3Provider(APP_CHECK_SITE_KEY),isTokenAutoRefreshEnabled:true});}
  catch(e){console.warn("App Check not initialized:",e);}
}
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);
const storage=getStorage(firebaseApp);

const $=id=>document.getElementById(id);
const authScreen=$("authScreen"),app=$("app"),registerFields=$("registerFields"),registerName=$("registerName");
const email=$("email"),password=$("password"),authBtn=$("authBtn"),switchText=$("switchText"),authError=$("authError");
const usersList=$("usersList"),messages=$("messages"),messageInput=$("messageInput"),sendBtn=$("sendBtn");
const myName=$("myName"),myAvatar=$("myAvatar"),myPresence=$("myPresence"),chatName=$("chatName"),chatAvatar=$("chatAvatar");
const chatStatus=$("chatStatus"),logoutBtn=$("logoutBtn"),searchUsers=$("searchUsers"),backBtn=$("backBtn");
const typingIndicator=$("typingIndicator"),replyBar=$("replyBar"),replyText=$("replyText"),cancelReply=$("cancelReply");
const fileInput=$("fileInput"),attachBtn=$("attachBtn"),recordBtn=$("recordBtn"),toast=$("toast");
const profileModal=$("profileModal"),groupModal=$("groupModal"),searchModal=$("searchModal");

let isRegister=false,currentUser=null,selectedUser=null,selectedChat=null,unsubscribeMessages=null,unsubscribeChat=null,unsubscribeTyping=null;
let allUsers=[],loadedMessages=[],replyingTo=null,typingTimer=null,mediaRecorder=null,voiceChunks=[],isRecording=false;
let messaging=null,notificationToken=null;

switchText.onclick=()=>{
  isRegister=!isRegister;registerFields.classList.toggle("hidden",!isRegister);
  authBtn.textContent=isRegister?"Create Account":"Login";
  switchText.textContent=isRegister?"Already have an account? Login":"Create a new account";authError.textContent="";
};

authBtn.onclick=async()=>{
  authError.textContent="";
  try{
    if(isRegister){
      const name=registerName.value.trim(); if(!name) throw new Error("Enter your name.");
      const credential=await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);
      await setDoc(doc(db,"users",credential.user.uid),{
        uid:credential.user.uid,name,email:email.value.trim(),online:true,lastSeen:serverTimestamp(),createdAt:serverTimestamp()
      });
    }else await signInWithEmailAndPassword(auth,email.value.trim(),password.value);
  }catch(e){console.error(e);authError.textContent=e.message;}
};

onAuthStateChanged(auth,async user=>{
  if(user){
    currentUser=user;authScreen.style.display="none";app.classList.add("show");
    await ensureUserProfile();await setPresence(true);await loadMyProfile();listenUsers();loadGroupIndex();initNotifications();
  }else{
    currentUser=null;app.classList.remove("show");authScreen.style.display="flex";
  }
});

async function ensureUserProfile(){
  const r=doc(db,"users",currentUser.uid),s=await getDoc(r);
  if(!s.exists()) await setDoc(r,{uid:currentUser.uid,name:currentUser.email?.split("@")[0]||"User",email:currentUser.email||"",online:true,lastSeen:serverTimestamp(),createdAt:serverTimestamp()});
}
async function loadMyProfile(){
  const s=await getDoc(doc(db,"users",currentUser.uid));if(!s.exists())return;const d=s.data();
  myName.textContent=d.name||"User";renderAvatar(myAvatar,d.photoURL,d.name);
}
async function setPresence(online){
  if(!currentUser)return;
  try{await updateDoc(doc(db,"users",currentUser.uid),{online,lastSeen:serverTimestamp()});}catch(e){console.warn(e)}
  myPresence.textContent=online?"● Online":"● Offline";
}
setInterval(()=>{if(currentUser&&!document.hidden)setPresence(true)},30000);
document.addEventListener("visibilitychange",()=>{if(currentUser)setPresence(!document.hidden)});
window.addEventListener("beforeunload",()=>{if(currentUser)navigator.sendBeacon&&navigator.sendBeacon(location.href,"")});

function listenUsers(){
  const q=query(collection(db,"users"));
  onSnapshot(q,snap=>{
    allUsers=[];snap.forEach(x=>{if(x.id!==currentUser.uid)allUsers.push({id:x.id,...x.data()})});renderUsers(allUsers);
  });
}
function renderUsers(users){
  usersList.innerHTML="";
  const groups=users.filter(u=>u.isGroup);
  const people=users.filter(u=>!u.isGroup);
  if(groups.length){const l=document.createElement("div");l.className="section-label";l.textContent="Groups";usersList.appendChild(l);groups.forEach(renderUser)}
  const l=document.createElement("div");l.className="section-label";l.textContent="People";usersList.appendChild(l);
  if(!people.length){const e=document.createElement("div");e.style.cssText="padding:25px;color:#7d8799;text-align:center";e.textContent="No other users yet.";usersList.appendChild(e)}
  people.forEach(renderUser);
}
function renderUser(user){
  const div=document.createElement("div");div.className="user";
  const online=user.isGroup?true:!!user.online;
  div.innerHTML=`<div class="user-avatar"></div><div class="user-info"><div class="user-name">${esc(user.name||"User")}</div><div class="user-email"><span class="presence-dot ${online?"online":""}"></span>${user.isGroup?"Group":(online?"Online":lastSeen(user.lastSeen))}</div></div>`;
  renderAvatar(div.querySelector(".user-avatar"),user.photoURL,user.name);
  div.onclick=()=>openChat(user,div);usersList.appendChild(div);
}
function lastSeen(ts){if(!ts?.toDate)return"Offline";return"Last seen "+formatTime(ts.toDate())}
function renderAvatar(el,url,name){
  if(url)el.innerHTML=`<img src="${escAttr(url)}" alt="">`;else el.textContent=getInitials(name);
}
function getInitials(n){return(n||"U").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
function escAttr(v){return esc(v).replace(/"/g,"&quot;")}

async function openChat(user,element){
  selectedUser=user;selectedChat=null;
  document.querySelectorAll(".user").forEach(x=>x.classList.remove("active"));element.classList.add("active");
  chatName.textContent=user.name||"User";renderAvatar(chatAvatar,user.photoURL,user.name);
  chatStatus.textContent=user.isGroup?"Group":(user.online?"● Online":lastSeen(user.lastSeen));
  messageInput.disabled=false;sendBtn.disabled=false;app.classList.add("chat-open");
  if(unsubscribeChat)unsubscribeChat();if(unsubscribeTyping)unsubscribeTyping();
  const chatId=getChatId(user);
  const chatRef=doc(db,"chats",chatId);const chatSnap=await getDoc(chatRef);
  if(!chatSnap.exists()){
    await setDoc(chatRef,{chatId,type:user.isGroup?"group":"direct",name:user.isGroup?user.name:null,participants:user.isGroup?user.participants:[currentUser.uid,user.id],createdAt:serverTimestamp(),typing:{}});
  }
  selectedChat={id:chatId,...(await getDoc(chatRef)).data()};
  listenMessages(chatId);listenTyping(chatId);
}
function getChatId(user=selectedUser){
  if(user?.isGroup)return user.chatId||user.id;
  return [currentUser.uid,user.id].sort().join("_");
}
function listenMessages(chatId){
  if(unsubscribeMessages)unsubscribeMessages();
  const q=query(collection(db,"chats",chatId,"messages"),orderBy("createdAt","asc"));
  unsubscribeMessages=onSnapshot(q,snap=>{
    loadedMessages=[];messages.innerHTML="";
    if(snap.empty){messages.innerHTML='<div class="empty">No messages yet. Say hello 👋</div>';return}
    snap.forEach(x=>{const d={id:x.id,...x.data()};loadedMessages.push(d);renderMessage(d)});
    scrollMessages();markMessagesDelivered(chatId);markMessagesSeen(chatId);
  },e=>{console.error(e);toastMsg("Chat read error: "+e.message)});
}
function renderMessage(d){
  const sent=d.senderId===currentUser.uid;
  const wrap=document.createElement("div");wrap.className="message-wrap "+(sent?"sent":"received");wrap.dataset.id=d.id;
  const actions=document.createElement("div");actions.className="message-actions";
  const reply=document.createElement("button");reply.textContent="↩";reply.title="Reply";reply.onclick=()=>startReply(d);
  actions.appendChild(reply);
  if(sent){const del=document.createElement("button");del.textContent="🗑";del.title="Delete";del.onclick=()=>deleteMessage(d);actions.appendChild(del)}
  const bubble=document.createElement("div");bubble.className="message";
  if(d.replyTo)bubble.innerHTML+=`<div class="reply-preview">${esc(d.replyTo.senderName||"User")}: ${esc(d.replyTo.text||"Attachment")}</div>`;
  if(d.type==="image")bubble.innerHTML+=`<img class="media" src="${escAttr(d.url)}" alt="${escAttr(d.fileName||"image")}">`;
  else if(d.type==="file")bubble.innerHTML+=`<div class="file-card">📄 <a href="${escAttr(d.url)}" target="_blank" rel="noopener">${esc(d.fileName||"File")}</a></div>`;
  else if(d.type==="audio")bubble.innerHTML+=`<audio controls src="${escAttr(d.url)}"></audio>`;
  else bubble.innerHTML+=esc(d.text||"");
  const t=d.createdAt?.toDate?formatTime(d.createdAt.toDate()):"...";
  const tick=sent?`<span class="ticks ${d.seen?"seen":""}">${d.seen||d.delivered?"✓✓":"✓"}</span>`:"";
  bubble.innerHTML+=`<span class="message-time">${t}${tick}</span>`;
  wrap.append(actions,bubble);messages.appendChild(wrap);
}
async function markMessagesDelivered(chatId){
  for(const d of loadedMessages){
    if(d.senderId!==currentUser.uid&&!d.delivered){
      try{await updateDoc(doc(db,"chats",chatId,"messages",d.id),{delivered:true})}catch(e){}
    }
  }
}
async function markMessagesSeen(chatId){
  if(!selectedUser)return;
  for(const d of loadedMessages){
    if(d.receiverId===currentUser.uid&&!d.seen){
      try{await updateDoc(doc(db,"chats",chatId,"messages",d.id),{seen:true})}catch(e){}
    }
  }
}
async function deleteMessage(d){
  if(!selectedChat)return;if(!confirm("Delete this message?"))return;
  try{await deleteDoc(doc(db,"chats",selectedChat.id,"messages",d.id));toastMsg("Message deleted");}
  catch(e){toastMsg(e.message)}
}
function startReply(d){replyingTo=d;replyText.textContent="Replying to: "+(d.text||d.fileName||"attachment");replyBar.classList.remove("hidden");messageInput.focus()}
cancelReply.onclick=()=>{replyingTo=null;replyBar.classList.add("hidden")}
async function sendMessage(textOverride=null){
  const text=textOverride??messageInput.value.trim();if(!text||!selectedChat)return;
  try{
    await addDoc(collection(db,"chats",selectedChat.id,"messages"),{
      text,senderId:currentUser.uid,receiverId:selectedUser.isGroup?null:selectedUser.id,
      senderName:myName.textContent,type:"text",delivered:false,seen:false,replyTo:replyingTo?{id:replyingTo.id,text:replyingTo.text||replyingTo.fileName||"Attachment",senderName:replyingTo.senderName||"User"}:null,
      createdAt:serverTimestamp()
    });
    messageInput.value="";cancelReply.click();clearTyping();
  }catch(e){toastMsg("Message failed: "+e.message)}
}
sendBtn.onclick=()=>sendMessage();
messageInput.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};
messageInput.oninput=()=>setTyping(true);

function listenTyping(chatId){
  unsubscribeTyping=onSnapshot(doc(db,"chats",chatId),s=>{
    const t=s.data()?.typing||{};const names=Object.entries(t).filter(([id,v])=>id!==currentUser.uid&&v).map(([id])=>id);
    typingIndicator.textContent=names.length?"typing…":"";
  });
}
async function setTyping(on){
  if(!selectedChat)return;
  clearTimeout(typingTimer);
  try{await updateDoc(doc(db,"chats",selectedChat.id),{["typing."+currentUser.uid]:on});}catch(e){}
  if(on)typingTimer=setTimeout(clearTyping,2500);
}
async function clearTyping(){
  clearTimeout(typingTimer);if(!selectedChat)return;
  try{await updateDoc(doc(db,"chats",selectedChat.id),{["typing."+currentUser.uid]:deleteField()})}catch(e){}
}

attachBtn.onclick=()=>{if(!selectedChat)return toastMsg("Select a chat first");fileInput.click()};
fileInput.onchange=async()=>{const files=[...fileInput.files];for(const f of files)await uploadAttachment(f);fileInput.value=""};
async function uploadAttachment(file){
  if(file.size>20*1024*1024)return toastMsg("Maximum file size is 20 MB.");
  const path=`chatFiles/${selectedChat.id}/${currentUser.uid}/${Date.now()}_${file.name.replace(/[^\w.\- ]/g,"_")}`;
  try{
    toastMsg("Uploading "+file.name+"…");const r=ref(storage,path);await uploadBytes(r,file);const url=await getDownloadURL(r);
    const type=file.type.startsWith("image/")?"image":"file";
    await addDoc(collection(db,"chats",selectedChat.id,"messages"),{
      type,url,fileName:file.name,mimeType:file.type,size:file.size,senderId:currentUser.uid,
      receiverId:selectedUser.isGroup?null:selectedUser.id,senderName:myName.textContent,seen:false,createdAt:serverTimestamp()
    });toastMsg("Uploaded");
  }catch(e){console.error(e);toastMsg("Upload failed. Enable Firebase Storage and publish its rules.")}
}

recordBtn.onclick=async()=>{
  if(!selectedChat)return toastMsg("Select a chat first");
  if(isRecording){mediaRecorder.stop();isRecording=false;recordBtn.classList.remove("recording");recordBtn.textContent="🎤";return}
  if(!navigator.mediaDevices?.getUserMedia)return toastMsg("Voice recording is not supported.");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];
    mediaRecorder=new MediaRecorder(stream);isRecording=true;recordBtn.classList.add("recording");recordBtn.textContent="⏹";
    mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
    mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(voiceChunks,{type:mediaRecorder.mimeType||"audio/webm"});await uploadVoice(blob)};
    mediaRecorder.start();
  }catch(e){toastMsg("Microphone permission denied.")}
};
async function uploadVoice(blob){
  const path=`voice/${selectedChat.id}/${currentUser.uid}/${Date.now()}.webm`;
  try{const r=ref(storage,path);await uploadBytes(r,blob);const url=await getDownloadURL(r);await addDoc(collection(db,"chats",selectedChat.id,"messages"),{type:"audio",url,fileName:"voice-message.webm",senderId:currentUser.uid,receiverId:selectedUser.isGroup?null:selectedUser.id,delivered:false,seen:false,createdAt:serverTimestamp()});toastMsg("Voice sent");}
  catch(e){toastMsg("Voice upload failed. Enable Firebase Storage.")}
}

$("profileBtn").onclick=async()=>{
  const s=await getDoc(doc(db,"users",currentUser.uid));const d=s.data()||{};$("profileName").value=d.name||"";profileModal.classList.remove("hidden");
};
$("saveProfile").onclick=async()=>{
  const name=$("profileName").value.trim();if(!name)return toastMsg("Enter a name.");
  try{
    let photoURL=null;const f=$("profilePhoto").files[0];
    if(f){const r=ref(storage,`profiles/${currentUser.uid}/avatar_${Date.now()}`);await uploadBytes(r,f);photoURL=await getDownloadURL(r)}
    const update={name};if(photoURL)update.photoURL=photoURL;
    await updateDoc(doc(db,"users",currentUser.uid),update);await loadMyProfile();profileModal.classList.add("hidden");toastMsg("Profile updated");
  }catch(e){toastMsg("Profile upload failed. Enable Firebase Storage.")}
};

$("groupBtn").onclick=()=>{
  $("groupName").value="";const box=$("groupUsers");box.innerHTML="";
  allUsers.filter(u=>!u.isGroup).forEach(u=>{const row=document.createElement("label");row.className="check-item";row.innerHTML=`<input type="checkbox" value="${escAttr(u.id)}"> <span>${esc(u.name||u.email)}</span>`;box.appendChild(row)});
  groupModal.classList.remove("hidden");
};
$("createGroup").onclick=async()=>{
  const name=$("groupName").value.trim();const ids=[...document.querySelectorAll("#groupUsers input:checked")].map(x=>x.value);
  if(!name||!ids.length)return toastMsg("Enter a group name and select users.");
  try{
    const participants=[currentUser.uid,...ids];const c=await addDoc(collection(db,"chats"),{type:"group",name,participants,createdBy:currentUser.uid,createdAt:serverTimestamp(),typing:{}});
    await setDoc(doc(db,"groupIndex",c.id),{chatId:c.id,name,participants,createdBy:currentUser.uid,createdAt:serverTimestamp()});
    groupModal.classList.add("hidden");toastMsg("Group created. Refreshing list…");loadGroupIndex();
  }catch(e){toastMsg("Group create failed: "+e.message)}
};
async function loadGroupIndex(){
  try{
    const snap=await getDocs(query(collection(db,"groupIndex"),where("participants","array-contains",currentUser.uid)));const groups=[];
    snap.forEach(x=>{const d=x.data();if((d.participants||[]).includes(currentUser.uid))groups.push({id:x.id,chatId:x.id,isGroup:true,...d})});
    allUsers=[...allUsers.filter(x=>!x.isGroup),...groups];renderUsers(allUsers);
  }catch(e){console.warn("Group index:",e.message)}
}
setInterval(()=>{if(currentUser)loadGroupIndex()},10000);

searchUsers.oninput=()=>{
  const term=searchUsers.value.toLowerCase().trim();
  renderUsers(allUsers.filter(u=>(u.name||"").toLowerCase().includes(term)||(u.email||"").toLowerCase().includes(term)));
};
$("searchMessagesBtn").onclick=()=>{
  if(!selectedChat)return toastMsg("Select a chat first");
  $("messageSearchInput").value="";renderSearchResults("");searchModal.classList.remove("hidden");
};
$("messageSearchInput").oninput=e=>renderSearchResults(e.target.value.toLowerCase());
function renderSearchResults(term){
  const box=$("messageSearchResults");const arr=loadedMessages.filter(d=>(d.text||d.fileName||"").toLowerCase().includes(term));
  box.innerHTML=arr.length?arr.map(d=>`<div style="padding:10px;border-bottom:1px solid var(--line)">${esc(d.text||d.fileName||"Attachment")}</div>`).join(""):"No matches.";
}
$("themeBtn").onclick=()=>{document.documentElement.classList.toggle("theme-light");localStorage.setItem("shaanTheme",document.documentElement.classList.contains("theme-light")?"light":"dark")};
if(localStorage.getItem("shaanTheme")==="light")document.documentElement.classList.add("theme-light");
backBtn.onclick=()=>app.classList.remove("chat-open");
logoutBtn.onclick=async()=>{await setPresence(false);await signOut(auth)};

document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add("hidden"));
window.onclick=e=>{if(e.target.classList.contains("modal"))e.target.classList.add("hidden")};

async function initNotifications(){
  if(!("Notification"in window)||!await isSupported().catch(()=>false))return;
  try{messaging=getMessaging(firebaseApp);onMessage(messaging,p=>toastMsg(p.notification?.title||"New message"))}catch(e){console.warn("FCM unavailable",e)}
}
$("notifyBtn").onclick=async()=>{
  if(!messaging||!VAPID_KEY)return toastMsg("Add your Firebase Web Push VAPID key in the code first.");
  try{
    const permission=await Notification.requestPermission();if(permission!=="granted")return toastMsg("Notification permission denied.");
    const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");
    notificationToken=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    await updateDoc(doc(db,"users",currentUser.uid),{fcmTokens:arrayUnion(notificationToken)});
    toastMsg("Browser notifications enabled");
  }catch(e){console.error(e);toastMsg("Notifications setup failed: "+e.message)}
};

function scrollMessages(){messages.scrollTop=messages.scrollHeight}
function formatTime(date){return date.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function toastMsg(text){toast.textContent=text;toast.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.add("hidden"),2800)}
</script>
</body>
</html>
