<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseChat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,255,255,.12),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(120,0,255,.15),transparent 30%),
        #070b14;
    color:#fff;
}

/* AUTH */

.auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:420px;
    padding:35px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    box-shadow:0 30px 80px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:800;
    margin-bottom:8px;
}

.logo span{
    color:#00eaff;
}

.subtitle{
    text-align:center;
    color:#9da8bb;
    margin-bottom:28px;
}

.input{
    width:100%;
    padding:14px 16px;
    margin-bottom:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.12);
    outline:none;
    background:rgba(0,0,0,.25);
    color:#fff;
}

.input:focus{
    border-color:#00eaff;
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#00eaff,#7c3cff);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.switch{
    text-align:center;
    margin-top:18px;
    color:#9da8bb;
}

.switch span{
    color:#00eaff;
    cursor:pointer;
}

/* APP */

.app{
    display:none;
    height:100vh;
}

.sidebar{
    width:330px;
    border-right:1px solid rgba(255,255,255,.08);
    background:rgba(7,11,20,.92);
    display:flex;
    flex-direction:column;
}

.sidebar-top{
    padding:22px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
    font-size:25px;
    font-weight:800;
}

.brand span{
    color:#00eaff;
}

.me{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:20px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#00eaff,#7c3cff);
    font-weight:800;
}

.me-info strong{
    display:block;
}

.me-info small{
    color:#48e6a1;
}

.logout{
    margin-left:auto;
    border:0;
    background:transparent;
    color:#ff667d;
    cursor:pointer;
}

.search{
    margin-top:20px;
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    color:#fff;
    outline:none;
}

.users{
    overflow:auto;
    flex:1;
}

.user{
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.04);
}

.user:hover,
.user.active{
    background:rgba(0,234,255,.08);
}

.user-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#172033;
    color:#00eaff;
    font-weight:700;
}

.user-name{
    font-weight:600;
}

.user-email{
    color:#8490a5;
    font-size:12px;
    margin-top:4px;
}

/* CHAT */

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    min-height:75px;
    padding:15px 24px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,11,20,.7);
}

.chat-title{
    font-weight:700;
}

.chat-status{
    font-size:12px;
    color:#48e6a1;
    margin-top:4px;
}

.messages{
    flex:1;
    padding:25px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.empty{
    margin:auto;
    text-align:center;
    color:#778298;
}

.message{
    max-width:70%;
    padding:11px 15px;
    border-radius:16px;
    line-height:1.4;
    word-break:break-word;
}

.message.sent{
    align-self:flex-end;
    background:linear-gradient(135deg,#006f83,#7137c9);
    border-bottom-right-radius:4px;
}

.message.received{
    align-self:flex-start;
    background:#151d2c;
    border-bottom-left-radius:4px;
}

.message-time{
    display:block;
    font-size:10px;
    opacity:.65;
    margin-top:5px;
    text-align:right;
}

.composer{
    padding:16px;
    display:flex;
    gap:10px;
    border-top:1px solid rgba(255,255,255,.08);
    background:rgba(7,11,20,.8);
}

.message-input{
    flex:1;
    padding:14px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    background:#101725;
    color:#fff;
    outline:none;
}

.send{
    width:55px;
    border:0;
    border-radius:14px;
    background:#00d9ee;
    color:#001218;
    font-size:20px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        width:100%;
        display:flex;
    }

    .chat{
        display:none;
    }

    .app.chat-open .sidebar{
        display:none;
    }

    .app.chat-open .chat{
        display:flex;
    }

    .mobile-back{
        display:block !important;
    }

}

.mobile-back{
    display:none;
    border:0;
    background:transparent;
    color:#00eaff;
    font-size:20px;
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->

<section class="auth-screen" id="authScreen">

    <div class="auth-box">

        <div class="logo">
            Pulse<span>Chat</span>
        </div>

        <div class="subtitle">
            Real-time messaging platform
        </div>

        <div id="registerFields" style="display:none;">
            <input
                class="input"
                id="registerName"
                placeholder="Your name"
                type="text"
            >
        </div>

        <input
            class="input"
            id="email"
            placeholder="Email address"
            type="email"
        >

        <input
            class="input"
            id="password"
            placeholder="Password"
            type="password"
        >

        <button class="btn" id="authBtn">
            Login
        </button>

        <div class="switch">
            <span id="switchText">
                Create a new account
            </span>
        </div>

        <p id="authError"
           style="color:#ff6b81;text-align:center;margin-top:15px;font-size:13px;">
        </p>

    </div>

</section>


<!-- APPLICATION -->

<section class="app" id="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                Pulse<span>Chat</span>
            </div>

            <div class="me">

                <div class="avatar" id="myAvatar">
                    U
                </div>

                <div class="me-info">
                    <strong id="myName">
                        User
                    </strong>
                    <small>● Online</small>
                </div>

                <button class="logout" id="logoutBtn">
                    Logout
                </button>

            </div>

            <input
                class="search"
                id="searchUsers"
                placeholder="Search users..."
            >

        </div>

        <div class="users" id="usersList"></div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <header class="chat-header">

            <button
                class="mobile-back"
                id="backBtn">
                ←
            </button>

            <div
                class="user-avatar"
                id="chatAvatar">
                ?
            </div>

            <div>

                <div
                    class="chat-title"
                    id="chatName">
                    Select a user
                </div>

                <div
                    class="chat-status"
                    id="chatStatus">
                    Start a conversation
                </div>

            </div>

        </header>


        <div class="messages" id="messages">

            <div class="empty">
                Select a user to start chatting 💬
            </div>

        </div>


        <div class="composer">

            <input
                class="message-input"
                id="messageInput"
                placeholder="Type a message..."
                disabled
            >

            <button
                class="send"
                id="sendBtn"
                disabled>
                ➤
            </button>

        </div>

    </main>

</section>


<script type="module">

/* ==========================================
   FIREBASE IMPORTS
========================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    setDoc,
    doc,
    getDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
   REPLACE THESE VALUES
========================================== */

const firebaseConfig = {
    apiKey: "AIzaSyAsJnJrF8MehSSvMuNHvBG310FkWKdXf9mU",
    authDomain: "shaan1731.firebaseapp.com",
    projectId: "shaan1731",
    storageBucket: "shaan1731.firebasestorage.app",
    messagingSenderId: "605552600836",
    appId: "1:605552600836:web:b9ac71747648a6c2f6d251"
};


/* ==========================================
   INITIALIZE FIREBASE
========================================== */

const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);

const db =
    getFirestore(firebaseApp);


/* ==========================================
   DOM
========================================== */

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const registerFields =
    document.getElementById("registerFields");

const registerName =
    document.getElementById("registerName");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const authBtn =
    document.getElementById("authBtn");

const switchText =
    document.getElementById("switchText");

const authError =
    document.getElementById("authError");

const usersList =
    document.getElementById("usersList");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const myName =
    document.getElementById("myName");

const myAvatar =
    document.getElementById("myAvatar");

const chatName =
    document.getElementById("chatName");

const chatAvatar =
    document.getElementById("chatAvatar");

const chatStatus =
    document.getElementById("chatStatus");

const logoutBtn =
    document.getElementById("logoutBtn");

const searchUsers =
    document.getElementById("searchUsers");

const backBtn =
    document.getElementById("backBtn");


/* ==========================================
   STATE
========================================== */

let isRegister = false;

let currentUser = null;

let selectedUser = null;

let unsubscribeMessages = null;

let allUsers = [];


/* ==========================================
   LOGIN / REGISTER SWITCH
========================================== */

switchText.addEventListener("click", () => {

    isRegister = !isRegister;

    registerFields.style.display =
        isRegister ? "block" : "none";

    authBtn.textContent =
        isRegister ? "Create Account" : "Login";

    switchText.textContent =
        isRegister
            ? "Already have an account? Login"
            : "Create a new account";

    authError.textContent = "";

});


/* ==========================================
   AUTH BUTTON
========================================== */

authBtn.addEventListener("click", async () => {

    authError.textContent = "";

    try {

        if (isRegister) {

            const name =
                registerName.value.trim();

            if (!name) {
                throw new Error("Enter your name.");
            }

            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email.value.trim(),
                    password.value
                );

            await setDoc(
                doc(db, "users", credential.user.uid),
                {
                    uid: credential.user.uid,
                    name: name,
                    email: email.value.trim(),
                    createdAt: serverTimestamp()
                }
            );

        } else {

            await signInWithEmailAndPassword(
                auth,
                email.value.trim(),
                password.value
            );

        }

    } catch(error) {

        console.error(error);

        authError.textContent =
            error.message;

    }

});


/* ==========================================
   AUTH STATE
========================================== */

onAuthStateChanged(auth, async user => {

    if (user) {

        currentUser = user;

        authScreen.style.display =
            "none";

        app.style.display =
            "flex";

        await loadMyProfile();

        loadUsers();

    } else {

        currentUser = null;

        authScreen.style.display =
            "flex";

        app.style.display =
            "none";

    }

});


/* ==========================================
   MY PROFILE
========================================== */

async function loadMyProfile(){

    const snap =
        await getDoc(
            doc(db, "users", currentUser.uid)
        );

    if (snap.exists()) {

        const data =
            snap.data();

        myName.textContent =
            data.name || "User";

        myAvatar.textContent =
            getInitials(data.name);

    }

}


/* ==========================================
   LOAD USERS
========================================== */

function loadUsers(){

    const q =
        query(
            collection(db, "users")
        );

    onSnapshot(q, snapshot => {

        allUsers = [];

        snapshot.forEach(item => {

            if (
                item.id !== currentUser.uid
            ) {

                allUsers.push({
                    id: item.id,
                    ...item.data()
                });

            }

        });

        renderUsers(allUsers);

    });

}


/* ==========================================
   RENDER USERS
========================================== */

function renderUsers(users){

    usersList.innerHTML = "";

    if (!users.length) {

        usersList.innerHTML =
            `<div style="padding:25px;color:#7d8799;text-align:center">
                No other users yet.
             </div>`;

        return;

    }

    users.forEach(user => {

        const div =
            document.createElement("div");

        div.className = "user";

        div.innerHTML = `

            <div class="user-avatar">
                ${escapeHtml(
                    getInitials(user.name)
                )}
            </div>

            <div>
                <div class="user-name">
                    ${escapeHtml(
                        user.name || "User"
                    )}
                </div>

                <div class="user-email">
                    ${escapeHtml(
                        user.email || ""
                    )}
                </div>
            </div>

        `;

        div.addEventListener(
            "click",
            () => openChat(user, div)
        );

        usersList.appendChild(div);

    });

}


/* ==========================================
   OPEN CHAT
========================================== */

function openChat(user, element){

    selectedUser = user;

    document
        .querySelectorAll(".user")
        .forEach(el =>
            el.classList.remove("active")
        );

    element.classList.add("active");

    chatName.textContent =
        user.name || "User";

    chatAvatar.textContent =
        getInitials(user.name);

    chatStatus.textContent =
        user.email || "Available";

    messageInput.disabled = false;

    sendBtn.disabled = false;

    messages.innerHTML = "";

    app.classList.add("chat-open");

    listenMessages();

}


/* ==========================================
   CHAT ID
========================================== */

function getChatId(){

    return [
        currentUser.uid,
        selectedUser.id
    ]
    .sort()
    .join("_");

}


/* ==========================================
   REAL-TIME MESSAGES
========================================== */

function listenMessages(){

    if (unsubscribeMessages) {
        unsubscribeMessages();
    }

    const chatId =
        getChatId();

    const q =
        query(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            orderBy("createdAt", "asc")
        );

    unsubscribeMessages =
        onSnapshot(q, snapshot => {

            messages.innerHTML = "";

            if (snapshot.empty) {

                messages.innerHTML =
                    `<div class="empty">
                        No messages yet. Say hello 👋
                     </div>`;

                return;

            }

            snapshot.forEach(item => {

                const data =
                    item.data();

                renderMessage(data);

            });

            scrollMessages();

        });

}


/* ==========================================
   RENDER MESSAGE
========================================== */

function renderMessage(data){

    const div =
        document.createElement("div");

    const sent =
        data.senderId === currentUser.uid;

    div.className =
        "message " +
        (sent ? "sent" : "received");

    const time =
        data.createdAt
            ? formatTime(
                data.createdAt.toDate()
              )
            : "...";

    div.innerHTML = `

        ${escapeHtml(data.text || "")}

        <span class="message-time">
            ${time}
        </span>

    `;

    messages.appendChild(div);

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();

    if (!text || !selectedUser) {
        return;
    }

    const chatId =
        getChatId();

    try {

        await addDoc(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            {
                text: text,
                senderId: currentUser.uid,
                receiverId: selectedUser.id,
                createdAt: serverTimestamp()
            }
        );

        messageInput.value = "";

        messageInput.focus();

    } catch(error) {

        console.error(
            "Message error:",
            error
        );

        alert(
            "Message send nahi hua: " +
            error.message
        );

    }

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==========================================
   SEARCH
========================================== */

searchUsers.addEventListener(
    "input",
    () => {

        const term =
            searchUsers.value
                .toLowerCase()
                .trim();

        const filtered =
            allUsers.filter(user =>
                (user.name || "")
                    .toLowerCase()
                    .includes(term)
                ||
                (user.email || "")
                    .toLowerCase()
                    .includes(term)
            );

        renderUsers(filtered);

    }
);


/* ==========================================
   LOGOUT
========================================== */

logoutBtn.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


/* ==========================================
   MOBILE BACK
========================================== */

backBtn.addEventListener(
    "click",
    () => {

        app.classList.remove(
            "chat-open"
        );

    }
);


/* ==========================================
   HELPERS
========================================== */

function getInitials(name){

    if (!name) {
        return "U";
    }

    return name
        .split(" ")
        .map(word =>
            word.charAt(0)
        )
        .join("")
        .substring(0,2)
        .toUpperCase();

}


function formatTime(date){

    return date.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function scrollMessages(){

    messages.scrollTop =
        messages.scrollHeight;

}


function escapeHtml(value){

    const div =
        document.createElement("div");

    div.textContent =
        value;

    return div.innerHTML;

}

</script>

</body>
</html>
